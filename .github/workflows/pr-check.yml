name: Build Check

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check code formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_ASSET_PREFIX: /my-portfolio
          NEXT_PUBLIC_IS_EXPORT: true
          NEXT_PUBLIC_MEDIUM_FEED_API_URL: https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmedium.com%2Ffeed%2F%40isharadh2002
        run: npm run build

      - name: Format build output
        run: npm run format:out
